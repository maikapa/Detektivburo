<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1729">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Detektivbüro</title>
<style>
  :root {
    --nacht:#16233F; --tiefer:#0E1729; --lampe:#FFC24B; --lampe-weich:#FFE0A3;
    --gruen:#3DD68C; --rot:#FF6B5A; --offen:#8FA3C8; --papier:#F7EFE0;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  .such-feld, .chip, .akte, .verd .figur, .verd .merkmale, .item, .kauf,
  .steckbrief, .ziel .z-sym, .reiter button, .kopf-knopf, svg text {
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",
                ui-rounded,system-ui,sans-serif;
  }
  html,body { margin:0; padding:0; }
  html,body { height:100%; }
  body {
    height:100vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:radial-gradient(circle at 50% 0%, var(--nacht) 0%, var(--tiefer) 70%);
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
    color:var(--papier); padding:8px 10px; -webkit-user-select:none; user-select:none;
  }
  @supports (height: 100dvh) { body { height:100dvh; } }

  /* Der Fallbildschirm ist eine Spalte über die volle Höhe: alle
     Zeilen behalten ihre Größe, das Suchbild nimmt exakt den Rest.
     Dadurch muss nie gescrollt werden, egal wie hoch das Display ist. */
  #app { max-width:380px; margin:0 auto; height:100%;
         display:flex; flex-direction:column; gap:5px; }
  #app > .tafel, #app > .wahl { flex:1; min-height:0; overflow-y:auto; }
  /* Das Suchbild darf schrumpfen, aber nicht unter eine Größe, bei der
     die Tippziele zu klein werden. Auf sehr kurzen Displays darf die
     Seite dann doch scrollen – lieber das als unerreichbare Objekte. */
  .szene-huelle { flex:1; min-height:360px; display:flex; margin-bottom:0 !important; }
  svg.szene { width:100%; height:100%; flex:1; min-height:0; }

  /* Rückfall für ältere Browser (iOS 12): kein aspect-ratio, kein
     gap im Grid. Die Regeln unten greifen nur dort, wo aspect-ratio
     fehlt – moderne Geräte sehen davon nichts. */
  @supports not (aspect-ratio: 1) {
    .teil { height:74px; }
    .farbe { height:34px; }
    .slot-zeile > * { margin-right:6px; }
  }
  button { font-family:inherit; color:inherit; border:none; cursor:pointer; background:none; }

  .kopf { display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
  .kopf-links { display:flex; align-items:center; gap:8px; }
  .rang-name { font-size:15px; font-weight:700; line-height:1.15; }
  .rang-sub { font-size:12px; color:var(--offen); }
  .gold { font-size:15px; font-weight:700; color:var(--lampe);
          background:rgba(255,194,75,.14); border-radius:14px; padding:8px 10px; }
  .kopf-knopf { background:rgba(255,255,255,.08); border-radius:14px; font-size:16px; padding:8px 10px; }
  .kopf-knopf.witz-an { background:rgba(255,194,75,.3); outline:2px solid var(--lampe); }

  .fortschritt { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .balken { flex:1; height:10px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden; }
  .balken.duenn { height:5px; margin-top:3px; }
  .rang-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .balken-fuellung { height:100%; border-radius:6px; background:var(--lampe); transition:width .5s ease; }
  .fortschritt .zahl { font-size:12px; color:var(--offen); min-width:52px; }

  .reiter { display:flex; gap:5px; flex:0 0 auto; }
  .reiter button { flex:1; background:rgba(255,255,255,.08); border-radius:12px;
                   font-size:18px; padding:5px 0; position:relative; }
  .reiter button.aktiv { background:rgba(255,194,75,.22); outline:2px solid var(--lampe); }
  .punkt { position:absolute; top:5px; right:8px; width:8px; height:8px;
           border-radius:50%; background:var(--gruen); }

  .tafel { background:rgba(255,255,255,.06); border-radius:20px; padding:14px; }
  .tafel-kopf { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .tafel-titel { font-size:24px; }
  .schliessen { font-size:22px; padding:4px 10px; }

  .buehne { display:grid; place-items:center; margin-bottom:8px; }
  .sammelstand { font-size:13px; color:var(--offen); margin-top:4px; }
  .slot-zeile { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:6px; }
  .slot-titel { font-size:20px; margin:8px 0 4px; opacity:.8; }
  .teil { aspect-ratio:1; border-radius:14px; background:rgba(255,255,255,.07);
          display:grid; place-items:center; position:relative; padding:3px; }
  .teil.zu { background:rgba(0,0,0,.22); }
  .teil .silhouette { filter:brightness(0) saturate(0) opacity(.42); }
  .teil.kaufbar { background:rgba(255,194,75,.14); outline:1px solid rgba(255,194,75,.4); }
  .teil.an { background:rgba(255,194,75,.28); outline:2px solid var(--lampe); }
  .teil .wirkung { position:absolute; right:2px; top:2px; font-size:11px; }
  .teilpreis { position:absolute; bottom:-1px; left:0; right:0; font-size:10px;
               font-weight:700; color:var(--lampe); }

  .farbleiste { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin:8px 0 4px; }
  .farbe { aspect-ratio:1; border-radius:10px; }
  .farbe.aktiv { outline:3px solid var(--papier); }
  .pinsel-hinweis { font-size:12px; color:var(--offen); text-align:center; margin-top:6px; }

  .kauf { flex:1; background:rgba(255,194,75,.16); border-radius:16px; padding:12px 0; font-size:28px; }
  .kauf.zuteuer { background:rgba(255,255,255,.04); opacity:.35; }
  .kauf .preis { display:block; font-size:14px; font-weight:700; color:var(--lampe); margin-top:4px; }
  .laden-zeile { display:flex; gap:8px; margin-bottom:10px; }
  .untertabs { display:flex; gap:4px; margin-bottom:10px; }
  .untertabs button { flex:1; background:rgba(255,255,255,.07); border-radius:12px;
                      font-size:17px; padding:7px 0; }
  .untertabs button.aktiv { background:rgba(255,194,75,.24); outline:2px solid var(--lampe); }
  .hinweiszeile { text-align:center; font-size:13px; color:var(--offen); margin-top:8px; }
  .teil.gewaehlt { outline:2px solid var(--lampe); background:rgba(255,194,75,.28); }
  .farbe.zu { opacity:.35; position:relative; }
  .topfpreis { position:absolute; inset:0; display:grid; place-items:center; font-size:13px; }
  .upgrade { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.06);
             border-radius:16px; padding:10px 12px; margin-bottom:6px; width:100%; }
  .upgrade.gekauft { opacity:.4; }
  .upgrade .u-icon { font-size:24px; }
  .upgrade .u-preis { margin-left:auto; font-weight:700; color:var(--lampe); font-size:14px; }

  .ziel { display:flex; align-items:center; gap:12px; width:100%; background:rgba(255,255,255,.06);
          border-radius:16px; padding:10px 12px; margin-bottom:6px; }
  .ziel.reif { background:rgba(255,194,75,.16); outline:1px solid rgba(255,194,75,.45); }
  .ziel.fertig { background:rgba(61,214,140,.12); }
  .ziel.aktiv { background:rgba(255,194,75,.26); outline:2px solid var(--lampe); }
  .ziel .z-sym { font-size:28px; }
  .ziel .z-mitte { flex:1; display:flex; align-items:center; gap:10px; }
  .z-balken { flex:1; height:10px; border-radius:6px; background:rgba(0,0,0,.3); overflow:hidden; }
  .z-fuell { display:block; height:100%; background:var(--lampe); border-radius:6px; }
  .z-rest { font-size:13px; font-weight:700; color:var(--lampe); white-space:nowrap; }
  .z-fertig { margin-left:auto; font-size:20px; }
  .z-tier { display:flex; }

  .kapitel { border-left:3px solid var(--rot); padding-left:12px; margin:4px 0 14px; }
  .kapitel-kopf { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .steckbrief { background:#E8DCC0; color:#2B2118; border-radius:12px; padding:4px 10px;
                display:flex; align-items:center; gap:7px; flex:0 0 auto; }
  .steckbrief .fig { font-size:24px; }
  .steckbrief .m { font-size:17px; }
  .steckbrief .fehlt { opacity:.35; }
  .akte { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.07);
          border-radius:12px; padding:8px 10px; margin-bottom:5px; font-size:20px; }
  .akte .nr { font-size:12px; color:var(--offen); min-width:26px; }
  .leer-hinweis { text-align:center; font-size:34px; opacity:.4; padding:20px 0; }

  .auftrag { display:flex; align-items:center; gap:10px; background:rgba(255,194,75,.12);
             border:1px solid rgba(255,194,75,.3); border-radius:16px; padding:5px 10px; flex:0 0 auto; }
  .auftrag .beute { font-size:30px; line-height:1; }
  .auftrag .pfeil { font-size:20px; color:var(--lampe-weich); opacity:.7; }
  .suchliste { display:flex; gap:6px; }
  .such-feld { font-size:22px; width:38px; height:38px; display:grid; place-items:center;
               border-radius:14px; background:rgba(0,0,0,.25); filter:grayscale(1) brightness(.55);
               border:2px dashed rgba(255,255,255,.25); }
  .such-feld.hat { background:rgba(61,214,140,.22); filter:none; border:2px solid var(--gruen); }
  .such-feld.verdeckt { filter:none; color:var(--offen); font-size:20px; }

  .szene-huelle { position:relative; margin-bottom:12px; }
  svg.szene { width:100%; display:block; border-radius:22px; }

  .verdaechtige { display:grid; gap:6px; flex:0 0 auto; }
  .verd { background:rgba(255,255,255,.1); border:2px solid var(--offen); border-radius:14px;
          padding:4px 2px 3px; transition:opacity .35s, filter .35s; position:relative; }
  .verd.raus { background:rgba(255,255,255,.04); border-color:transparent; opacity:.28; filter:grayscale(1); }
  .verd.gesperrt { opacity:.55; }
  .verd.ziel { border-color:var(--lampe); background:rgba(255,194,75,.18);
               animation:pochen 1.1s ease-in-out infinite; }
  .verd.gefasst { border-color:var(--gruen); background:rgba(61,214,140,.24); animation:none; }
  .verd .figur { font-size:27px; line-height:1; }
  .verd .merkmale { display:flex; justify-content:center; flex-wrap:wrap; gap:1px;
                    margin-top:2px; font-size:15px; line-height:1.05; }
  .verd .merkmale span.treffer { animation:aufleuchten .8s ease-out; border-radius:6px; }
  .verd .handschelle { position:absolute; top:2px; right:4px; font-size:14px; }

  .ausruestung { display:flex; gap:8px; flex:0 0 auto; }
  .item { flex:1; background:rgba(255,194,75,.16); border-radius:14px; padding:7px 0; font-size:22px; }
  .item.leer { background:rgba(255,255,255,.04); opacity:.3; }
  .item .n { font-size:14px; margin-left:6px; }

  .modal { position:fixed; inset:0; background:rgba(14,23,41,.95); display:grid;
           place-items:center; padding:20px; overflow-y:auto; z-index:20; }
  .modal-inner { text-align:center; }
  .e-kopf { font-size:38px; line-height:1.1; }
  .e-bande { font-size:26px; }
  .e-jubel { font-size:32px; margin:2px 0 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:330px; }
  .chip { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.09);
          border-radius:16px; padding:8px 12px; font-size:24px; }
  .chip small { font-size:13px; color:var(--offen); }
  .chip .pfeilchen { font-size:16px; opacity:.6; }
  .chip.gold-chip { color:var(--lampe); font-weight:700; background:rgba(255,194,75,.18); }
  .chip.teil-chip { background:rgba(255,194,75,.18); padding:4px 10px; }
  .weiter { background:var(--lampe); color:var(--tiefer); border-radius:20px; padding:14px 40px;
            font-size:28px; margin-top:18px; }
  .ja-nein { display:flex; gap:14px; justify-content:center; margin-top:22px; }
  .ja  { background:var(--gruen); color:var(--tiefer); border-radius:20px; padding:14px 34px; font-size:26px; }
  .nein{ background:rgba(255,255,255,.12); border-radius:20px; padding:14px 34px; font-size:26px; }
  .dialog-preis { font-size:26px; font-weight:700; color:var(--lampe); margin-top:14px; }
  .dialog-zuwenig { color:var(--rot); }

  .wahl { display:grid; place-items:center; min-height:74vh; }
  .wahl-raster { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .wahl-feld { background:rgba(255,255,255,.08); border-radius:22px; padding:10px; }
  .stand { display:flex; align-items:center; gap:12px; background:rgba(255,255,255,.08);
           border-radius:20px; padding:10px 14px; margin-bottom:10px; width:100%; }
  .stand.frei { justify-content:center; font-size:30px; padding:22px 0; opacity:.6; }
  .stand .info { text-align:left; font-size:14px; line-height:1.35; }
  .stand .loesch { font-size:18px; opacity:.55; padding:6px 6px; }
  .transferfeld { width:100%; height:130px; margin-top:14px; border-radius:14px; padding:10px;
                  font-family:ui-monospace,monospace; font-size:11px; line-height:1.35;
                  background:rgba(0,0,0,.35); color:var(--papier);
                  border:1px solid rgba(255,255,255,.18); resize:none; -webkit-user-select:text;
                  user-select:text; }
  .transfer-meldung { margin-top:10px; font-size:15px; color:var(--lampe); }
  .version { text-align:center; font-size:12px; color:var(--offen); opacity:.55; margin-top:14px; }

  @keyframes wackel { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px) rotate(-6deg)}
                      75%{transform:translateX(5px) rotate(6deg)} }
  @keyframes blinken { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(1.35)} }
  @keyframes auftauchen { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
  @keyframes pochen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  @keyframes aufleuchten { 0%{background:rgba(61,214,140,.9)} 100%{background:transparent} }
  @keyframes tippen { 0%,100%{transform:translateY(0);opacity:.85} 50%{transform:translateY(-10px);opacity:1} }
  @keyframes huepf { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .wackel { animation:wackel .4s ease-in-out; }
  .blink { animation:blinken .5s ease-in-out 4; }
  .pop { animation:auftauchen .35s cubic-bezier(.2,1.4,.4,1); }
  .huepft { animation:huepf .9s ease-in-out infinite; }
  .tipphand { position:absolute; left:55%; top:40%; font-size:36px;
              animation:tippen 1.2s ease-in-out infinite; pointer-events:none; }
  @media (max-height: 700px) {
    .balken.duenn, .rang-sub { display:none; }
    .auftrag { padding:4px 8px; }
    .auftrag .beute { font-size:26px; }
    .such-feld { width:34px; height:34px; font-size:19px; }
    .verd .figur { font-size:23px; }
    .verd .merkmale { font-size:15px; max-width:36px; }
    .item { padding:5px 0; font-size:20px; }
    .reiter button { padding:4px 0; font-size:16px; }
    .steckbrief .fig { font-size:20px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .wackel,.blink,.pop,.huepft,.verd.ziel,.tipphand { animation:none; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ============================================================
   DETEKTIVBÜRO – Wimmelbild-Ermittlung für 7–8-Jährige
   Eine Datei, kein Build, keine externen Skripte, offline lauffähig.

   Spielregel, komplett ohne Text vermittelt:
   1. Oben: was gestohlen wurde und welche Spuren zu finden sind.
   2. Erst wenn ALLE Spuren gefunden sind, lässt sich jemand anklagen.
   3. Jede Spur blendet die Verdächtigen aus, die sie nicht tragen.
   4. Kampagne: fünf Fälle pro Kapitel entlang einer Stadtkarte. Alle
      Täter gehören derselben Bande und stehlen Teile ein und
      derselben Sache, die einer Person gehört. Der sechste Fall ist
      der Bossfall gegen den Anführer. Danach neues Kapitel.
   ============================================================ */

var KATALOG = [
  { id:"stiefel", icon:"🥾" }, { id:"brille",    icon:"👓" },
  { id:"hund",    icon:"🐕" }, { id:"muetze",    icon:"🧢" },
  { id:"rad",     icon:"🚲" }, { id:"pinsel",    icon:"🖌️" },
  { id:"schlues", icon:"🔑" }, { id:"schirm",    icon:"☂️" },
  { id:"gitarre", icon:"🎸" }, { id:"keks",      icon:"🍪" },
  { id:"katze",   icon:"🐈" }, { id:"handschuh", icon:"🧤" }
];

var FIGUREN  = ["👨","👩","👦","👧","🧒","🧓","👵","👴","👱","🧔"];
var ABLENKER = ["🍎","🌻","⚽","🎏","🐞","🍄","🧺","🧦","📚","🥤",
                "🎲","🎈","🐌","🍌","🍂","🍹","🐝","🥕","🍇","🧩","🚗","🌍"];

/* Bandenzeichen: wird beim Lösen sichtbar und verknüpft die Fälle. */
var BANDEN = ["🦊","🦉","🐍","🕷️","🦇","🐙","🐺","🦅"];

/* Witzmodus: nach jedem Fall gibt es was zu essen. */
var FUTTER = ["🍔","🍕","🍩","🌭","🍟","🧁","🍰","🥨","🍫","🍦","🥞","🌮"];

/* Jedes Kapitel bestohlen: fünf Teile, die zusammen ein Ganzes ergeben.
   Bewusst ohne Überschneidung mit Spuren- oder Ablenker-Symbolen. */
var THEMEN = [
  { ziel:"🎉", teile:["🎂","🎁","🍭","🎺","🎊"] },
  { ziel:"🏖️", teile:["👒","🕶️","🏐","🍦","🐚"] },
  { ziel:"🚀", teile:["🛰️","🔭","🛸","🧪","⭐"] },
  { ziel:"🎪", teile:["🎟️","🦁","🥁","🎩","🍿"] },
  { ziel:"🗺️", teile:["🧭","💎","⚓","🏺","🦜"] },
  { ziel:"🎼", teile:["🎹","🎤","🎧","🎷","🎻"] },
  { ziel:"⛄", teile:["🧣","🛷","☕","❄️","🍫"] },
  { ziel:"🍽️", teile:["🍳","🥄","🧁","🥛","🥨"] }
];

var ORTE = [
  { name:"Park",   himmel:"#7FC7E8", boden:"#8FD16A" },
  { name:"Küche",  himmel:"#FFD9A0", boden:"#E8B27A" },
  { name:"Schule", himmel:"#A8C6F0", boden:"#C7D4E8" },
  { name:"Zoo",    himmel:"#FFE39B", boden:"#D9C089" },
  { name:"Strand", himmel:"#8FE3E0", boden:"#F2DFAE" },
  { name:"Versteck", himmel:"#5B6480", boden:"#4A4453" }
];

var RAENGE = [
  { ab:25, name:"Meisterdetektiv", abzeichen:"🏅" },
  { ab:12, name:"Ermittler",       abzeichen:"🎖️" },
  { ab:5,  name:"Fährtensucher",   abzeichen:"🧭" },
  { ab:1,  name:"Spurenleser",     abzeichen:"🔎" }
];

var BASIS = [
  { haut:"#F2C6A0", haar:"#4A3220", form:"kurz"   },
  { haut:"#8D5A3B", haar:"#1E1310", form:"locken" },
  { haut:"#F7DFC4", haar:"#D9A441", form:"lang"   },
  { haut:"#5C3A24", haar:"#241610", form:"zopf"   }
];

var ITEMS = [
  { id:"deerstalker", slot:"hut", preis:18, wirkung:"gold",   hinweis:"💰" },
  { id:"kappe",       slot:"hut", preis:10 },
  { id:"wollmuetze",  slot:"hut", preis:10 },
  { id:"zylinder",    slot:"hut", preis:12 },
  { id:"cowboy",      slot:"hut", preis:12 },
  { id:"dreispitz",   slot:"hut", preis:14 },
  { id:"krone",       slot:"hut", preis:20 },
  { id:"kopfhoerer",  slot:"hut", preis:12 },

  { id:"sonnen",      slot:"brille", preis:10 },
  { id:"nachtsicht",  slot:"brille", preis:18, wirkung:"dunkel", hinweis:"🔦" },
  { id:"monokel",     slot:"brille", preis:12 },
  { id:"taucher",     slot:"brille", preis:10 },
  { id:"augenklappe", slot:"brille", preis:12 },
  { id:"hornbrille",  slot:"brille", preis:10 },

  { id:"mantel_beige",  slot:"kleidung", preis:10, farbe:"#C9A87C" },
  { id:"mantel_rot",    slot:"kleidung", preis:10, farbe:"#C4534B" },

/* ============================================================
   FALLERZEUGUNG
   Invariante: nach Auswertung aller Spuren bleibt genau die
   Tätergruppe übrig – nie mehrdeutig, nie unlösbar.
   ============================================================ */
function stufenOptionen(level, stufe) {
  return {
    anzV:     Math.min(3 + Math.floor((level-1)/3), 5),
    anzS:     Math.min(1 + Math.floor((level-1)/4), 3),
    anzA:     Math.min(8 + 2*level, 17),
    anzM:     (stufe>=2 && level>=5) ? 4 : 3,
    komplize: (stufe>=4 && level>=12)
  };
}

function erzeugeFall(level, opt, fix, ort, beute) {
  var o = opt || stufenOptionen(level, 0);
  var anzV = o.anzV, anzS = o.anzS, anzM = o.anzM || 3;
  var anzTaeter = o.komplize ? 2 : 1;

  for (var versuch=0; versuch<1500; versuch++) {
    var poolBasis = mische(KATALOG);
    var pool = poolBasis.slice(0, Math.max(6, anzM+3));
    if (fix) {
      pool = fix.merkmale.map(katalog);
      poolBasis.forEach(function (k) {
        if (pool.length < Math.max(6, anzM+3) && fix.merkmale.indexOf(k.id)<0) pool.push(k);
      });
    }
    var figPool = fix ? mische(FIGUREN.filter(function(f){ return f!==fix.figur; })) : mische(FIGUREN);

    var verdaechtige = [];
    for (var i=0;i<anzV;i++) {
      verdaechtige.push({
        id: "v"+i, figur: figPool[i],
        merkmale: mische(pool).slice(0,anzM).map(function(m){ return m.id; })
      });
    }
    if (fix) { verdaechtige[0].figur = fix.figur; verdaechtige[0].merkmale = fix.merkmale.slice(0,anzM); }

    var taeter = fix ? [verdaechtige[0]] : mische(verdaechtige).slice(0, anzTaeter);
    var spurMerkmale;

    if (!fix && anzTaeter===2) {
      var gemeinsam = taeter[0].merkmale.filter(function(m){ return taeter[1].merkmale.indexOf(m)>=0; });
      if (gemeinsam.length < anzS) continue;
      spurMerkmale = mische(gemeinsam).slice(0, anzS);
    } else {
      if (taeter[0].merkmale.length < anzS) continue;
      spurMerkmale = mische(taeter[0].merkmale).slice(0, anzS);
    }

    var fall = pruefe(verdaechtige, taeter, spurMerkmale, level, o.anzA||12, ort, beute);
    if (fall) return fall;
  }
  return erzeugeFall(level, { anzV:3, anzS:1, anzA:10, anzM:3, komplize:false }, fix, ort, beute);
}

function pruefe(verdaechtige, taeter, spurMerkmale, level, ablenkerAnz, ort, beute) {
  var uebrig = verdaechtige.filter(function (v) {
    return spurMerkmale.every(function (m) { return v.merkmale.indexOf(m)>=0; });
  });
  if (uebrig.length !== taeter.length) return null;
  for (var i=0;i<taeter.length;i++) if (uebrig.indexOf(taeter[i])<0) return null;

  var nuetzt = spurMerkmale.every(function (m) {
    return verdaechtige.some(function (v) { return v.merkmale.indexOf(m)<0; });
  });
  if (!nuetzt) return null;

  var spuren = spurMerkmale.map(function (m) { return { merkmal:m, icon:katalog(m).icon }; });

  var verboten = {};
  spuren.forEach(function (sp) { verboten[sp.icon] = true; });
  verdaechtige.forEach(function (v) {
    v.merkmale.forEach(function (m) { verboten[katalog(m).icon] = true; });
  });
  var ablenker = mische(ABLENKER).filter(function (e) { return !verboten[e]; }).slice(0, ablenkerAnz);

  var freie = [];
  for (var sl=0; sl<SPALTEN*ZEILEN; sl++) if (BESETZT.indexOf(sl)<0) freie.push(sl);
  var slots = mische(freie).slice(0, spuren.length + ablenker.length);

  var roh = spuren.map(function (sp) { return { icon:sp.icon, spur:sp.merkmal }; })
    .concat(ablenker.map(function (e) { return { icon:e, spur:null }; }));

  var objekte = roh.map(function (ob, i) {
    var slot = slots[i];
    var sx = (slot % SPALTEN)*ZELLE + ZELLE/2;
    var sy = Math.floor(slot/SPALTEN)*ZELLE + ZELLE/2;
    return { icon:ob.icon, spur:ob.spur, key:"o"+i,
             x: sx + (Math.random()*2-1)*JITTER, y: sy + (Math.random()*2-1)*JITTER };
  });

  return {
    level: level, ort: ort || wuerfle(ORTE), beute: beute || "🧸",
    verdaechtige: verdaechtige,
    taeterIds: taeter.map(function (t) { return t.id; }),
    spuren: spuren, objekte: mische(objekte), dunkel: level>=8
  };
}

/* --- Kampagne --- */
function erzeugeSchurke() {
  return { figur: wuerfle(FIGUREN), merkmale: mische(KATALOG).slice(0,4).map(function(k){ return k.id; }) };
}
function neuesKapitel() {
  S.schurke   = erzeugeSchurke();
  S.bande     = wuerfle(BANDEN);
  S.thema     = zufall(THEMEN.length);
  S.besitzer  = wuerfle(FIGUREN);
  S.fetzen    = 0;
  S.geborgen  = [];
}
function thema() { return THEMEN[S.thema]; }
function istBossfall() { return S.fallImKapitel > FAELLE_JE_KAPITEL; }

/* Ab Level 25 geht es endlos weiter: alle 15 Level ein Stern mehr,
   damit der Fortschrittsbalken nie stehenbleibt. */
var STERN_AB = 25, STERN_SCHRITT = 15;

function rangVon(level) {
  if (level >= STERN_AB) {
    var st = Math.floor((level-STERN_AB)/STERN_SCHRITT) + 1;
    return { ab: STERN_AB + (st-1)*STERN_SCHRITT, name: "Meisterdetektiv",
             abzeichen: "🏅", sterne: st };
  }
  for (var i=0;i<RAENGE.length;i++) if (level>=RAENGE[i].ab) return RAENGE[i];
  return RAENGE[RAENGE.length-1];
}

function naechsterRang(level) {
  if (level >= STERN_AB - 0) {
    var st = Math.floor((level-STERN_AB)/STERN_SCHRITT) + 1;
    return { ab: STERN_AB + st*STERN_SCHRITT, abzeichen: "🏅", sterne: st+1 };
  }
  var kand = null;
  for (var i=0;i<RAENGE.length;i++) if (RAENGE[i].ab > level)
    if (!kand || RAENGE[i].ab < kand.ab) kand = RAENGE[i];
  return kand;
}

function rangText(r) {
  if (!r.sterne) return r.name;
  return r.name + " " + (r.sterne > 5 ? "⭐×"+r.sterne : Array(r.sterne+1).join("⭐"));
}
function traegtWirkung(w) {
  for (var i=0;i<SLOTS.length;i++) {
    var id = S.angezogen[SLOTS[i]];
    if (id) { var it = itemVon(id); if (it && it.wirkung===w) return true; }
  }
  return false;
}
function hatUpgrade(id) { return S.upgrades.indexOf(id)>=0; }
function hatDing(id)    { return S.dinge.indexOf(id)>=0; }
function tierWirkt(w) {
  if (!S.tierAktiv) return false;
  var t = tierVon(S.tierAktiv);
  return !!t && t.wirkung === w;
}
function goldFuerFall(fall) {
  return 4 + 2*fall.spuren.length + (traegtWirkung("gold")?2:0) + (istBossfall()?10:0)
       + (tierWirkt("gold") ? (tierStufe()>=3?2:1) : 0) + S.hq*2;
}
var PREISE = { lupe:4, hund:6, lampe:8 };

/* ============================================================
   SPIELSTÄNDE – drei getrennte Sessions, jede mit eigenem Schlüssel
   ============================================================ */
/* Sichtbar im Spielstände-Menü – daran erkennst du, ob eine neue
   Fassung angekommen ist. Bei jeder Auslieferung hochzählen,
   zusammen mit der Cache-Nummer in sw.js. */
var VERSION = "v12";

var BASIS_KEY = "detektivbuero.v6";
var ANZ_STAENDE = 3;
function slotKey(i) { return BASIS_KEY + ".slot" + i; }

function leseSlot(i) {
  try { var r = window.localStorage.getItem(slotKey(i)); if (r) return JSON.parse(r); }
  catch (e) { /* kein Zugriff */ }
  return null;
}
function loescheSlot(i) {
  try { window.localStorage.removeItem(slotKey(i)); } catch (e) { /* egal */ }
}
function merkeAktiv(i) {
  try { window.localStorage.setItem(BASIS_KEY + ".aktiv", String(i)); } catch (e) { /* egal */ }
}
function leseAktiv() {
  try { var r = window.localStorage.getItem(BASIS_KEY + ".aktiv"); return r===null?null:parseInt(r,10); }
  catch (e) { return null; }
}
/* Export/Import: der ganze Spielstand als Textcode. Versicherung
   gegen geleerten Browserspeicher und Weg auf ein neues Handy.
   Umweg über encodeURIComponent, weil btoa an Emoji scheitert. */
function standAlsCode(i) {
  var d = leseSlot(i);
  if (!d) return "";
  try { return btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }
  catch (e) { return ""; }
}
function codeAlsStand(code) {
  try {
    var d = JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g,"")))));
    return (d && d.profil) ? d : null;
  } catch (e) { return null; }
}
function schreibeSlot(i, d) {
  try { window.localStorage.setItem(slotKey(i), JSON.stringify(d)); return true; }
  catch (e) { return false; }
}
function ersterFreierSlot() {
  for (var i=0;i<ANZ_STAENDE;i++) if (!leseSlot(i)) return i;
  return -1;
}

function speichereStand() {
  if (S.slot===null) return;
  try {
    window.localStorage.setItem(slotKey(S.slot), JSON.stringify({
      profil:S.profil, besitz:S.besitz, angezogen:S.angezogen, farben:S.farben,
      moebel:S.moebel, upgrades:S.upgrades, level:S.level, items:S.items, gold:S.gold,
      stufe:S.stufe, hilfeSerie:S.hilfeSerie, kapitel:S.kapitel, fallImKapitel:S.fallImKapitel,
      schurke:S.schurke, bande:S.bande, thema:S.thema, besitzer:S.besitzer,
      fetzen:S.fetzen, geborgen:S.geborgen, archiv:S.archiv.slice(-60), paketKapitel:S.paketKapitel,
      witz:S.witz, speck:S.speck, tiere:S.tiere, tierAktiv:S.tierAktiv,
      hq:S.hq, dinge:S.dinge, gehege:S.gehege, farbtoepfe:S.farbtoepfe
    }));
  } catch (e) { /* kein Zugriff */ }
}

var S = {
  slot: null, profil: null, besitz: [], angezogen: { hut:null, brille:null, kleidung:null, hand:null },
  farben: {}, moebel: [], upgrades: [], level: 1, items: { lupe:1, hund:1, lampe:0 },
  gold: 0, stufe: 0, hilfeSerie: 0, kapitel: 1, fallImKapitel: 1,
  schurke: null, bande: null, thema: 0, besitzer: null, fetzen: 0, geborgen: [],
  archiv: [], paketKapitel: 0, witz: false, speck: 0,
  tiere: [], tierAktiv: null, hq: 0, dinge: [], freiRaus: [],
  gehege: [], farbtoepfe: [], ladenTab: "hilfe",
  fall: null, gefunden: [], angeklagt: [], hilfeGenutzt: false,
  hell: false, erfolg: null, panel: null, farbwahl: null, dialog: null,
  spuerZone: null, neuesteSpur: null, transfer: null
};

function ladeSlot(i) {
  var d = leseSlot(i);
  S.slot = i;
  if (d) {
    S.profil=d.profil; S.besitz=d.besitz||[]; S.angezogen=d.angezogen||{hut:null,brille:null,kleidung:null,hand:null};
    S.farben=d.farben||{}; S.moebel=d.moebel||[]; S.upgrades=d.upgrades||[];
    S.level=d.level||1; S.items=d.items||{lupe:1,hund:1,lampe:0}; S.gold=d.gold||0;
    S.stufe=d.stufe||0; S.hilfeSerie=d.hilfeSerie||0; S.kapitel=d.kapitel||1;
    S.fallImKapitel=d.fallImKapitel||1; S.schurke=d.schurke; S.bande=d.bande;
    S.thema=d.thema||0; S.besitzer=d.besitzer; S.fetzen=d.fetzen||0;
    S.geborgen=d.geborgen||[]; S.archiv=d.archiv||[]; S.paketKapitel=d.paketKapitel||0;
    S.witz=!!d.witz; S.speck=d.speck||0;
    S.tiere=d.tiere||[]; S.tierAktiv=d.tierAktiv||null; S.hq=d.hq||0; S.dinge=d.dinge||[];
    S.gehege=d.gehege||[]; S.farbtoepfe=d.farbtoepfe||[];
  } else {
    S.profil=null; S.besitz=[]; S.angezogen={hut:null,brille:null,kleidung:null,hand:null};
    S.farben={}; S.moebel=[]; S.upgrades=[]; S.level=1; S.items={lupe:1,hund:1,lampe:0};
    S.gold=0; S.stufe=0; S.hilfeSerie=0; S.kapitel=1; S.fallImKapitel=1;
    S.archiv=[]; S.paketKapitel=0; S.schurke=null; S.witz=false; S.speck=0;
    S.tiere=[]; S.tierAktiv=null; S.hq=0; S.dinge=[]; S.gehege=[]; S.farbtoepfe=[];
  }
  if (!S.schurke) neuesKapitel();
  S.panel=null; S.dialog=null; S.farbwahl=null;
  merkeAktiv(i);
  S.fall = baueFall();
  starteFall();
}

function baueFall() {
  var t = thema();
  if (istBossfall()) {
    return erzeugeFall(S.level, { anzV:8, anzS:3, anzA:17, anzM:4, komplize:false },
      S.schurke, ORTE[5], t.ziel);
  }
  return erzeugeFall(S.level, stufenOptionen(S.level, S.stufe), null,
    ORTE[(S.fallImKapitel-1) % 5], t.teile[(S.fallImKapitel-1) % 5]);
}

function ausgeschlossen() {
  var raus = {};
  (S.freiRaus||[]).forEach(function (id) { raus[id] = true; });
  S.fall.verdaechtige.forEach(function (v) {
    var passt = S.fall.spuren.every(function (sp) {
      if (S.gefunden.indexOf(sp.merkmal)<0) return true;
      return v.merkmale.indexOf(sp.merkmal)>=0;
    });
    if (!passt) raus[v.id] = true;
  });
  return raus;
}
function alleSpurenDa()   { return S.gefunden.length === S.fall.spuren.length; }
function dunkelAktiv()    { return S.fall.dunkel && !S.hell; }
function spurenSichtbar() { return S.level < VERDECKT_AB || traegtWirkung("notizen"); }

   DARSTELLUNG
   ============================================================ */
var app = document.getElementById("app");

function renderStaende() {
  var h = '<div style="font-size:40px;text-align:center;margin:14px 0 18px">🕵️</div>';
  for (var i=0;i<ANZ_STAENDE;i++) {
    var d = leseSlot(i);
    if (d && d.profil) {
      h += '<div class="stand"><button data-act="slot" data-i="'+i+'" '
        +  'style="display:flex;align-items:center;gap:12px;flex:1;text-align:left">'
        +  figurBox(d.profil, d.angezogen||{}, 62)
        +  '<span class="info"><b>' + rangText(rangVon(d.level||1)) + '</b><br>'
        +  '📖 ' + (d.kapitel||1) + ' · 🔎 ' + (d.level||1) + ' · 💰 ' + (d.gold||0) + '</span>'
        +  '</button><button class="loesch" data-act="export" data-i="'+i+'">📤</button>'
        +  '<button class="loesch" data-act="loeschen" data-i="'+i+'">🗑️</button></div>';
    } else {
      h += '<button class="stand frei" data-act="slot" data-i="'+i+'">➕</button>';
    }
  }
  if (ersterFreierSlot() >= 0)
    h += '<button class="stand frei" data-act="importfenster" style="font-size:20px">📥</button>';
  h += '<div class="version">'+VERSION+'</div>';
  if (S.transfer) h += renderTransfer();
  app.innerHTML = h;
}

/* Fenster zum Kopieren oder Einfügen eines Spielstand-Codes. */
function renderTransfer() {

  var h = '<div class="modal"><div class="modal-inner pop" style="width:100%;max-width:330px">'
    + '<div style="font-size:40px">'+(t.modus==="export"?"📤":"📥")+'</div>'

function renderWahl() {
  var h = '<div class="wahl"><div><div style="font-size:44px;text-align:center;margin-bottom:18px">🕵️</div>'
        + '<div class="wahl-raster">';

function kopfHTML() {
  var rang = rangVon(S.level), naechster = naechsterRang(S.level);
  var anteil = naechster ? (S.level-rang.ab)/(naechster.ab-rang.ab) : 1;

  var h = '<div class="kopf"><div class="kopf-links">'
    + '<span style="font-size:24px">'+rang.abzeichen+'</span>'
    + '<div style="flex:1;min-width:0">'
    +   '<div class="rang-name">'+rangText(rang)+'</div>'
    +   '<div class="rang-sub">📖 '+S.kapitel+' · '+Math.min(S.fallImKapitel,FAELLE_JE_KAPITEL+1)
    +   '/'+(FAELLE_JE_KAPITEL+1)+(istBossfall()?' 👑':'')+' · 🔎 '+S.level+'</div>'
    // Der Balken sitzt jetzt in der Kopfzeile statt in einer eigenen Reihe
    +   '<div class="balken duenn"><div class="balken-fuellung" style="width:'
    +   Math.max(4, Math.round(anteil*100))+'%"></div></div>'
    + '</div></div>'
    + '<div style="display:flex;gap:5px;align-items:center;flex:0 0 auto">'
    + '<span class="gold">💰 '+S.gold+'</span>'

    + '<button class="kopf-knopf" data-act="staende">👥</button></div></div>';

  var kaufbar = ITEMS.some(function (it) { return S.besitz.indexOf(it.id)<0 && S.gold>=it.preis; });
  h += '<div class="reiter">'
    + reiterKnopf("laden","🛒", ZIELE.concat(TIERE).concat(GEHEGE).concat(MOEBEL)
        .some(function (z) { return S.gold>=z.preis; }))
    + reiterKnopf("garderobe","🧥", kaufbar)
    + reiterKnopf("karte","🗺️", false)
    + reiterKnopf("ordner","📁", false)
    + reiterKnopf("buero","🛋️", false)
    + '</div>';
  return h;
}
function reiterKnopf(id, icon, punkt) {
  return '<button class="'+(S.panel===id?"aktiv":"")+'" data-act="panel" data-p="'+id+'">'
    + icon + (punkt?'<span class="punkt"></span>':'') + '</button>';
}
function tafelKopf(titel) {

    + '<button class="schliessen" data-act="panel" data-p="zu">✕</button></div>';
}
function farbleisteHTML() {

  if (!eigene.length) return '<div class="pinsel-hinweis">🎨 🔒 → 🛒</div>';
  var h = '<div class="farbleiste">';

  });

    +  'data-f="ab" style="background:rgba(255,255,255,.12)">⟲</button>';
  return h + '</div><div class="pinsel-hinweis">'
    + (S.farbwahl ? '🖌️ → 👆' : '🖌️') + '</div>';
}

/* Ein Laden für alles Käufliche. Die Rubriken liegen hinter
   kleinen Kartenreitern, damit immer nur eine Seite sichtbar ist

var LADEN_TABS = [

];

function preisKachel(sym, preis, besessen, aktion, id, extra) {

}

        + '<span class="u-icon">'+u.icon+'</span><span style="font-size:15px">'+u.text+'</span>'
        + '<span class="u-preis">'+(hat?"✓":"💰 "+u.preis)+'</span></button>';

          + '<span class="teilpreis">'+(aktiv?"🎒":"🏠")+'</span></button>';

    });
    h += '</div><div class="hinweiszeile">🐾 '+tierStufe()+'/3 · 🌾 '+S.gehege.length+'/'+GEHEGE.length+'</div>';
  }

  if (S.ladenTab === "gehege") {
    h += '<div class="slot-zeile" style="grid-template-columns:repeat(4,1fr)">';

      h += preisKachel(e.sym, e.preis, S.gehege.indexOf(e.id)>=0, "kaufgehege", e.id);
    });
    h += '</div><div class="hinweiszeile">🌾 3 → 🐾 2 · 🌾 6 → 🐾 3</div>';
  }

  if (S.ladenTab === "buero") {
    h += '<div class="slot-zeile" style="grid-template-columns:repeat(4,1fr)">';
    MOEBEL.forEach(function (m) {
      h += preisKachel(m.sym, m.preis, S.moebel.indexOf(m.id)>=0, "kaufmoebel", m.id);

  if (S.ladenTab === "ziele") {
    ZIELE.forEach(function (z) {

      h += zielZeile(z, da, "kaufziel");

  if (S.ladenTab === "farben") {
    h += '<div class="farbleiste">';

      h += '<button class="farbe'+(hat?"":" zu")+'" data-act="kauftopf" '

        +  (hat?'':'<span class="topfpreis">🔒</span>')+'</button>';
    });
    h += '</div><div class="hinweiszeile">💰 '+TOPF_PREIS+' je Topf · danach frei benutzbar</div>';
  }

  return h + '</div>';
}

function renderGarderobe() {
  var h = '<div class="tafel">' + tafelKopf("🧥")
    + '<div class="buehne">' + figurBox(S.profil, S.angezogen, 140)
    + '<div class="sammelstand">'+S.besitz.length+' / '+ITEMS.length+'</div></div>'
    + farbleisteHTML();
  SLOTS.forEach(function (slot) {
    h += '<div class="slot-titel">'+SLOT_SYMBOL[slot]+'</div><div class="slot-zeile">';
    ITEMS.filter(function (it) { return it.slot===slot; }).forEach(function (it) {
      var hat = S.besitz.indexOf(it.id)>=0, an = S.angezogen[slot]===it.id;
      var vor = {}; vor[slot] = it.id;
      if (hat) {
        h += '<button class="teil'+(an?" an":"")+'" data-act="teil" data-slot="'+slot+'" data-id="'+it.id+'">'
          +  figurBox(S.profil, vor, 58)
          +  (it.hinweis?'<span class="wirkung">'+it.hinweis+'</span>':'')+'</button>';
      } else {
        h += '<button class="teil zu'+(S.gold>=it.preis?" kaufbar":"")+'" data-act="kaufteil" data-id="'+it.id+'">'
          +  '<div class="silhouette">'+figurBox(S.profil, vor, 58)+'</div>'
          +  '<span class="teilpreis">💰'+it.preis+'</span></button>';
      }
    });
    h += '</div>';
  });
  return h + '</div>';
}

function steckbriefHTML(schurke, fetzen, klein) {
  var h = '<div class="steckbrief"><span style="font-size:20px">'+(S.bande||"")+'</span>'
    + '<span class="fig'+(fetzen>=1?"":" fehlt")+'">'+(fetzen>=1?schurke.figur:"❓")+'</span>';
  schurke.merkmale.forEach(function (m,i) {
    var da = fetzen >= i+2;
    h += '<span class="m'+(da?"":" fehlt")+'">'+(da?katalog(m).icon:"❔")+'</span>';
  });
  if (!klein) h += '<span style="margin-left:auto;font-size:13px">'+fetzen+'/5</span>';
  return h + '</div>';
}

/* Stadtkarte: fünf Tatorte plus Versteck, der Weg des Kapitels. */
var KARTE_PUNKTE = [[34,158],[86,106],[146,150],[202,96],[250,146],[272,44]];
function renderKarte() {
  var t = thema();
  var h = '<div class="tafel">' + tafelKopf("🗺️");
  h += '<svg viewBox="0 0 300 200" style="width:100%;display:block;border-radius:16px;background:#243554">';
  var d = "M";
  KARTE_PUNKTE.forEach(function (p,i) { d += (i?" L":" ")+p[0]+" "+p[1]; });
  h += '<path d="'+d+'" stroke="#FF6B5A" stroke-width="3" fill="none" stroke-dasharray="6 6"></path>';
  KARTE_PUNKTE.forEach(function (p,i) {
    var nr = i+1;
    var erledigt = nr < S.fallImKapitel;
    var aktuell  = nr === S.fallImKapitel;
    var farbe = erledigt ? "#3DD68C" : aktuell ? "#FFC24B" : "#5B6480";
    h += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(aktuell?15:12)+'" fill="'+farbe+'"></circle>';
    var sym = i===5 ? (erledigt?"👑":S.bande) : (erledigt ? t.teile[i] : (aktuell?"❓":"·"));
    h += '<text x="'+p[0]+'" y="'+p[1]+'" font-size="'+(i===5?14:13)+'" text-anchor="middle" '
      +  'dominant-baseline="central">'+sym+'</text>';
  });
  if (hatDing("auto")) {
    var wo = KARTE_PUNKTE[Math.max(0, Math.min(S.fallImKapitel-1, 5))];
    h += '<g transform="translate('+(wo[0]-14)+' '+(wo[1]+16)+')">'
      +  '<rect x="0" y="0" width="28" height="9" rx="4" fill="'+fb("auto","#C4534B")+'"></rect>'
      +  '<path d="M6 0 q8 -7 15 0 z" fill="#BFE4F5"></path>'
      +  '<circle cx="7" cy="10" r="3" fill="#22252E"></circle>'
      +  '<circle cx="22" cy="10" r="3" fill="#22252E"></circle></g>';
  }
  if (hatDing("zeppelin"))
    h += '<ellipse cx="70" cy="26" rx="24" ry="11" fill="'+fb("zeppelin","#EFC14E")+'"></ellipse>'
      +  '<rect x="64" y="36" width="12" height="6" rx="3" fill="#7A5636"></rect>';
  h += '</svg>';

  // Das gestohlene Ganze und wem es gehört
  h += '<div style="display:flex;align-items:center;gap:8px;margin-top:12px;background:rgba(255,255,255,.06);'
    + 'border-radius:16px;padding:10px 12px">'
    + '<span style="font-size:30px">'+S.besitzer+'</span><span style="opacity:.5">›</span>';
  t.teile.forEach(function (teil,i) {
    var da = S.geborgen.indexOf(i)>=0;
    h += '<span style="font-size:22px;'+(da?'':'filter:grayscale(1) opacity(.3)')+'">'+teil+'</span>';
  });
  h += '<span style="margin-left:auto;font-size:28px;'
    + (S.geborgen.length>=5?'':'filter:grayscale(1) opacity(.3)')+'">'+t.ziel+'</span></div>';

  h += '<div style="margin-top:10px">'+steckbriefHTML(S.schurke, S.fetzen, false)+'</div>';
  return h + '</div>';
}

function renderOrdner() {
  var h = '<div class="tafel">' + tafelKopf("📁");
  if (!S.archiv.length) return h + '<div class="leer-hinweis">🗒️</div></div>';
  var nach = {};
  S.archiv.slice().reverse().forEach(function (a) { (nach[a.k] = nach[a.k] || []).push(a); });
  Object.keys(nach).sort(function (a,b) { return b-a; }).forEach(function (k) {
    var bande = nach[k][0].bande || "";
    h += '<div class="kapitel"><div class="kapitel-kopf">'
      +  '<span style="font-size:16px">📖 '+k+'</span><span style="font-size:18px">'+bande+'</span></div>';
    nach[k].forEach(function (a) {
      h += '<div class="akte"><span class="nr">'+(a.boss?"👑":a.n)+'</span>'
        +  '<span>'+a.beute+'</span><span style="opacity:.5">›</span>';
      a.spuren.forEach(function (ic) { h += '<span>'+ic+'</span>'; });
      h += '<span style="margin-left:auto">'+a.taeter.join("")+'</span></div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}

function bueroBild() {
  // Reihenfolge macht die Tiefe: hinten, Tiere, Figur auf der Bühne, vorne
  return '<svg viewBox="0 0 300 210" style="width:100%;border-radius:16px;display:block">'
    + bueroHinten() + gehegeSVG() + bueroTiere()
    + '<g transform="translate(114 55) scale(0.8)">' + figurSVG(S.profil, S.angezogen) + '</g>'
    + bueroVorne() + '</svg>';
}

/* Sparziel-Zeile mit Fortschrittsbalken: „noch so viel" statt einer
   abstrakten Zahl – sonst ist Sparen für ein Kind nicht greifbar. */
function zielZeile(z, besessen, aktion, extra) {
  var anteil = Math.min(1, S.gold / z.preis);
  var reicht = S.gold >= z.preis;
  var h = '<button class="ziel'+(besessen?" fertig":"")+(reicht&&!besessen?" reif":"")+'" '
    + (besessen ? (extra||'') : 'data-act="'+aktion+'" data-id="'+z.id+'"') + '>'
    + '<span class="z-sym">'+z.sym+'</span><span class="z-mitte">';
  if (besessen) h += '<span class="z-fertig">✓</span>';
  else h += '<span class="z-balken"><span class="z-fuell" style="width:'
         + Math.round(anteil*100)+'%"></span></span>'
         + '<span class="z-rest">'+(reicht ? "💰 "+z.preis : "noch 💰 "+(z.preis-S.gold))+'</span>';
  return h + '</span></button>';
}

function renderBuero() {
  var h = '<div class="tafel">' + tafelKopf("🛋️")
    + bueroBild()
    + farbleisteHTML()
    + '<div class="slot-zeile" style="grid-template-columns:repeat(6,1fr);margin-top:6px">';
  // Gekauft wird im Laden – hier wird nur noch gefärbt
  MOEBEL.concat(GEHEGE).forEach(function (m) {
    if (S.moebel.indexOf(m.id)<0 && S.gehege.indexOf(m.id)<0) return;
    h += '<button class="teil an" data-act="faerbemoebel" data-id="'+m.id+'">'
      + '<span style="font-size:22px">'+m.sym+'</span></button>';
  });
  return h + '</div></div>';
}

/* Kaufbestätigung: Vorschau, Preis, Ja/Nein. Nichts wird ohne
   diesen Zwischenschritt abgebucht. */
function renderDialog() {
  var d = S.dialog;
  var reicht = S.gold >= d.preis;
  return '<div class="modal"><div class="modal-inner pop">'
    + '<div style="font-size:44px;min-height:120px;display:grid;place-items:center">'+d.vorschau+'</div>'
    + '<div class="dialog-preis'+(reicht?"":" dialog-zuwenig")+'">💰 '+d.preis+'</div>'
    + '<div style="font-size:14px;color:var(--offen);margin-top:6px">💰 '+S.gold+' → '
    + Math.max(0, S.gold-d.preis)+'</div>'
    + '<div class="ja-nein">'
    + (reicht ? '<button class="ja" data-act="jakauf">✓</button>' : '')
    + '<button class="nein" data-act="neinkauf">✕</button></div></div></div>';
}

function render() {
  if (S.slot === null) { renderStaende(); return; }
  if (!S.profil)       { renderWahl();    return; }

  var h = kopfHTML();
  if (S.panel==="laden")     { app.innerHTML = h + renderLaden()     + (S.dialog?renderDialog():""); return; }
  if (S.panel==="garderobe") { app.innerHTML = h + renderGarderobe() + (S.dialog?renderDialog():""); return; }
  if (S.panel==="karte")     { app.innerHTML = h + renderKarte()     + (S.dialog?renderDialog():""); return; }
  if (S.panel==="ordner")    { app.innerHTML = h + renderOrdner()    + (S.dialog?renderDialog():""); return; }
  if (S.panel==="buero")     { app.innerHTML = h + renderBuero()     + (S.dialog?renderDialog():""); return; }

  var f = S.fall, raus = ausgeschlossen(), frei = alleSpurenDa();
  if (istBossfall()) h += steckbriefHTML(S.schurke, 5, true);

  h += '<div class="auftrag" id="auftrag"><span class="beute">'+f.beute+'</span>'
    + '<span class="pfeil">›</span><span class="suchliste">';
  f.spuren.forEach(function (sp) {
    var hat = S.gefunden.indexOf(sp.merkmal)>=0;
    if (hat) h += '<span class="such-feld hat pop">'+sp.icon+'</span>';
    else if (spurenSichtbar()) h += '<span class="such-feld">'+sp.icon+'</span>';
    else h += '<span class="such-feld verdeckt">?</span>';
  });
  h += '</span></div>';

  h += '<div class="szene-huelle"><svg class="szene" viewBox="0 0 '+BREITE+' '+HOEHE+'" '
    + 'style="background:'+f.ort.himmel+'">'
    + '<rect x="0" y="'+(HOEHE*0.42)+'" width="'+BREITE+'" height="'+(HOEHE*0.58)
    + '" fill="'+f.ort.boden+'"></rect>'
    + ortDeko(f.ort);

  if (S.spuerZone) {
    h += '<rect x="'+S.spuerZone.x+'" y="'+S.spuerZone.y+'" width="'+S.spuerZone.w
      +  '" height="'+S.spuerZone.h+'" fill="#FFC24B" opacity="0.22" pointer-events="none"></rect>';
  }
  f.objekte.forEach(function (o) {
    var gef = o.spur && S.gefunden.indexOf(o.spur)>=0;
    h += '<g data-act="obj" data-key="'+o.key+'" style="transform-origin:'+o.x+'px '+o.y+'px;'
      + 'opacity:'+(gef?".25":"1")+'">';
    if (gef) h += '<circle cx="'+o.x+'" cy="'+o.y+'" r="26" fill="#3DD68C" opacity="0.4"></circle>';
    h += '<text x="'+o.x+'" y="'+o.y+'" font-size="34" text-anchor="middle" '
      + 'dominant-baseline="central">'+o.icon+'</text>'
      + '<rect x="'+(o.x-28)+'" y="'+(o.y-28)+'" width="56" height="56" fill="transparent"></rect></g>';
  });
  // pointer-events="none" ist Pflicht, sonst schlucken die Flächen jeden Tipper
  if (dunkelAktiv()) {
    h += '<rect x="0" y="0" width="'+BREITE+'" height="'+HOEHE+'" fill="#0B1120" opacity="'
      + ((traegtWirkung("dunkel")||tierWirkt("dunkel"))?0.34:0.68)+'" pointer-events="none"></rect>';
  }
  h += '<g transform="translate(6 282)" pointer-events="none">'+figurSVG(S.profil,S.angezogen)+'</g>';
  if (S.tierAktiv)
    h += '<g transform="translate(104 388)" pointer-events="none">'+tierSVG(S.tierAktiv)+'</g>';
  h += '</svg>';
  if (S.level===1 && S.gefunden.length===0) h += '<div class="tipphand">👆</div>';
  h += '</div>';

  var spalten = f.verdaechtige.length>5 ? 4 : f.verdaechtige.length;
  h += '<div class="verdaechtige" style="grid-template-columns:repeat('+spalten+',1fr)">';
  f.verdaechtige.forEach(function (v) {
    var kl = "verd";
    if (S.angeklagt.indexOf(v.id)>=0) kl += " gefasst";
    else if (raus[v.id]) kl += " raus";
    else if (!frei) kl += " gesperrt";
    else kl += " ziel";
    h += '<button class="'+kl+'" data-act="verd" data-id="'+v.id+'">'
      + (S.angeklagt.indexOf(v.id)>=0?'<span class="handschelle">🔗</span>':'')
      + '<div class="figur"><span style="display:inline-block;transform:scaleX('
      + (1 + Math.min(S.witz?S.speck:0,12)*0.035).toFixed(2)+')">'+v.figur+'</span></div>'
      + '<div class="merkmale">';
    v.merkmale.forEach(function (m) {
      h += '<span'+(S.neuesteSpur===m?' class="treffer"':'')+'>'+katalog(m).icon+'</span>';
    });
    h += '</div></button>';
  });
  h += '</div>';

  h += '<div class="ausruestung">';
  [{k:"lupe",i:"🔍",n:S.items.lupe},{k:"hund",i:"🐶",n:S.items.hund},
   {k:"lampe",i:"🔦",n:S.items.lampe}].forEach(function (it) {
    h += '<button class="item'+(it.n<1?" leer":"")+'" data-act="item" data-item="'+it.k+'">'
      + it.i+'<span class="n">'+it.n+'</span></button>';
  });
  h += '</div>';

  if (S.erfolg) {
    // Kompakt: eine Kopfzeile, darunter eine Reihe kleiner Belohnungs-
    // plättchen. Vorher stand alles untereinander und man musste scrollen.
    var e = S.erfolg;
    h += '<div class="modal"><div class="modal-inner pop">'
      + '<div class="e-kopf">'+e.taeter.join(" ")+' 🔗 <span class="e-bande">'+S.bande+'</span></div>'
      + '<div class="e-jubel">'+(e.boss?"👑🎉":"🎉")+'</div>'
      + '<div class="chips">'
      + '<span class="chip gold-chip">💰 '+e.gold+'</span>'
      + '<span class="chip">'+e.beute+' <span class="pfeilchen">→</span> '
      + '<span class="huepft">'+S.besitzer+'</span> 💛</span>';
    if (e.futter) h += '<span class="chip"><span class="huepft">'+e.futter+'</span> 😋</span>';
    if (e.fetzen) {
      var neu = S.fetzen===1 ? S.schurke.figur : katalog(S.schurke.merkmale[S.fetzen-2]).icon;
      h += '<span class="chip">🕵️ '+neu+' <small>'+S.fetzen+'/5</small></span>';
    }
    h += '</div><button class="weiter" data-act="weiter">▶</button></div></div>';
  }
  if (S.dialog) h += renderDialog();

  app.innerHTML = h;
  S.neuesteSpur = null;
}

function wackle(el) {
  if (!el) return;
  el.classList.remove("wackel"); void el.offsetWidth; el.classList.add("wackel");
  setTimeout(function () { el.classList.remove("wackel"); }, 420);
}

/* ============================================================
   AKTIONEN
   ============================================================ */
function waehleFigur(i) { S.profil = BASIS[i]; speichereStand(); S.fall = baueFall(); starteFall(); }

function starteFall() {
  S.gefunden=[]; S.angeklagt=[]; S.erfolg=null; S.hell=false;
  S.spuerZone=null; S.hilfeGenutzt=false; S.panel=null; S.dialog=null; S.freiRaus=[];
  if (hatUpgrade("gratis_lupe")) S.items.lupe += 1;
  if (traegtWirkung("spuer") || tierWirkt("zone"))
    markiereZone(wuerfle(S.fall.objekte.filter(function(o){ return o.spur; })));

  // Spürhund: jeden dritten Fall eine Spur geschenkt, nie die letzte
  if (tierWirkt("schnuff") && S.level % (tierStufe()>=3?2:3) === 0 && S.fall.spuren.length > 1)
    S.gefunden.push(wuerfle(S.fall.spuren).merkmal);

  // Affe räumt drei Ablenker weg – Spuren rührt er nicht an
  if (tierWirkt("raeumen")) {
    var weg = mische(S.fall.objekte.filter(function (o) { return !o.spur; }))
                .slice(0, tierStufe()>=3 ? 5 : 3);
    S.fall.objekte = S.fall.objekte.filter(function (o) { return weg.indexOf(o)<0; });
  }

  // Fuchs entlarvt einen Unschuldigen
  if (tierWirkt("entlarv")) {
    var unschuldig = S.fall.verdaechtige.filter(function (v) {
      return S.fall.taeterIds.indexOf(v.id)<0;
    });
    mische(unschuldig).slice(0, tierStufe()>=3 ? 2 : 1).forEach(function (v) {
      S.freiRaus.push(v.id);
    });
  }
  render();
}
function markiereZone(z) {
  if (!z) return;
  var hh = hatUpgrade("hund_fein") ? HOEHE/4 : HOEHE/2;
  S.spuerZone = { x: z.x<BREITE/2?0:BREITE/2,
                  y: Math.min(Math.floor(z.y/hh)*hh, HOEHE-hh), w: BREITE/2, h: hh };
}

function tippeObjekt(key, el) {
  if (S.erfolg || S.dialog) return;
  var o = null;
  S.fall.objekte.forEach(function (x) { if (x.key===key) o = x; });
  if (!o) return;
  if (o.spur && S.gefunden.indexOf(o.spur)<0) {
    S.gefunden.push(o.spur); S.neuesteSpur = o.spur; S.spuerZone = null; render();
  } else wackle(el);
}

function beschuldige(id, el) {
  if (S.erfolg || S.dialog) return;
  if (!alleSpurenDa()) { wackle(document.getElementById("auftrag")); return; }
  if (S.fall.taeterIds.indexOf(id)<0) { wackle(el); return; }
  if (S.angeklagt.indexOf(id)>=0) return;

  S.angeklagt.push(id);
  if (S.angeklagt.length < S.fall.taeterIds.length) { render(); return; }

  var boss = istBossfall();
  var lohn = goldFuerFall(S.fall);
  S.gold += lohn;

  // Adaptive Schwierigkeit: nur ohne Hilfsmittel geht es aufwärts,
  // nach zwei Fällen mit Hilfe still eine Stufe zurück.
  if (S.hilfeGenutzt) {
    S.hilfeSerie += 1;
    if (S.hilfeSerie>=2) { S.stufe = Math.max(0, S.stufe-1); S.hilfeSerie = 0; }
  } else { S.stufe = Math.min(8, S.stufe+1); S.hilfeSerie = 0; }

  var neuFetzen = false;
  if (!boss && S.fetzen < 5) { S.fetzen += 1; neuFetzen = true; }
  var teilNr = (S.fallImKapitel-1) % 5;
  if (!boss && S.geborgen.indexOf(teilNr)<0) S.geborgen.push(teilNr);

  var taeterFiguren = S.fall.verdaechtige
    .filter(function (v) { return S.fall.taeterIds.indexOf(v.id)>=0; })
    .map(function (v) { return v.figur; });

  S.archiv.push({
    k:S.kapitel, n:Math.min(S.fallImKapitel,FAELLE_JE_KAPITEL+1), boss:boss, bande:S.bande,
    beute:S.fall.beute, taeter:taeterFiguren,
    spuren:S.fall.spuren.map(function (sp) { return sp.icon; })
  });
  if (S.archiv.length>60) S.archiv = S.archiv.slice(-60);

  var futter = null;
  if (S.witz) { S.speck = Math.min((S.speck||0)+1, 12); futter = wuerfle(FUTTER); }

  S.erfolg = { taeter:taeterFiguren, gold:lohn, boss:boss, beute:S.fall.beute,
               fetzen:neuFetzen, futter:futter };
  speichereStand();
  render();
}

function naechsterFall() {
  var warBoss = istBossfall();
  S.level += 1;
  if (warBoss) { S.kapitel += 1; S.fallImKapitel = 1; neuesKapitel(); }
  else S.fallImKapitel += 1;
  S.fall = baueFall();
  speichereStand();
  starteFall();
}

function offeneSpuren() {
  return S.fall.objekte.filter(function (o) { return o.spur && S.gefunden.indexOf(o.spur)<0; });
}

/* --- Kauf immer über den Bestätigungsdialog --- */
function frage(typ, id, preis, vorschau) {
  S.dialog = { typ:typ, id:id, preis:preis, vorschau:vorschau };
  render();
}
function fuehreKaufAus() {
  var d = S.dialog;
  if (!d || S.gold < d.preis) { S.dialog = null; render(); return; }
  if (d.typ==="hilfe")   { S.gold -= d.preis; S.items[d.id] += 1; }
  if (d.typ==="teil")    { S.gold -= d.preis; S.besitz.push(d.id);
                           S.angezogen[itemVon(d.id).slot] = d.id; }
  if (d.typ==="moebel")  { S.gold -= d.preis; S.moebel.push(d.id); }
  if (d.typ==="upgrade") { S.gold -= d.preis; S.upgrades.push(d.id); }
  if (d.typ==="paket")   { S.gold -= d.preis; S.paketKapitel = S.kapitel;
                           S.items.lupe += 3; S.items.hund += 2; S.items.lampe += 1; }
  if (d.typ==="ziel")    { S.gold -= d.preis;
                           var zz = zielVon(d.id);
                           if (zz.art==="hq") S.hq = zz.stufe; else S.dinge.push(zz.id); }
  if (d.typ==="tier")    { S.gold -= d.preis; S.tiere.push(d.id);
                           if (!S.tierAktiv) S.tierAktiv = d.id; }
  if (d.typ==="gehege")  { S.gold -= d.preis; S.gehege.push(d.id); }
  if (d.typ==="topf")    { S.gold -= d.preis; S.farbtoepfe.push(d.id); }
  S.dialog = null;
  speichereStand();
  render();
}

/* Färben kostet nichts mehr – bezahlt wird der Topf, nicht der Anstrich.
   Damit ist auch der frühere Fehler weg, dieselbe Farbe mehrfach zu kaufen. */
function faerbe(id) {
  if (S.farbwahl === "ab") delete S.farben[id];
  else S.farben[id] = S.farbwahl;
  speichereStand(); render();
}

function teilAntippen(slot, id) {
  if (S.farbwahl) { faerbe(id); return; }
  S.angezogen[slot] = (S.angezogen[slot]===id) ? null : id;
  speichereStand(); render();
}

function moebelAntippen(id) { if (S.farbwahl) faerbe(id); }

function nutzeItem(name) {
  if (S.erfolg || S.dialog) return;
  if (name==="lupe") {
    if (S.items.lupe<1) return;
    var offen = offeneSpuren(); if (!offen.length) return;
    S.items.lupe -= 1; S.hilfeGenutzt = true;
    var ziele = mische(offen).slice(0, traegtWirkung("doppel")?2:1);
    var lang = hatUpgrade("lupe_lang");
    speichereStand(); render();
    ziele.forEach(function (z) {
      var el = app.querySelector('[data-key="'+z.key+'"]');
      if (el) {
        el.classList.add("blink");
        el.style.animationIterationCount = lang ? "8" : "4";
        setTimeout(function () { el.classList.remove("blink"); }, lang?4200:2100);
      }
    });
    return;
  }
  if (name==="hund") {
    if (S.items.hund<1) return;
    var offen2 = offeneSpuren(); if (!offen2.length) return;
    S.items.hund -= 1; S.hilfeGenutzt = true;
    markiereZone(wuerfle(offen2)); speichereStand(); render(); return;
  }
  if (name==="lampe") {
    if (S.items.lampe<1 || !dunkelAktiv()) return;
    S.items.lampe -= 1; S.hilfeGenutzt = true; S.hell = true;
    speichereStand(); render();
  }
}

/* --- Eingaben --- */
app.addEventListener("click", function (ev) {
  var z = ev.target.closest("[data-act]");
  if (!z) return;
  var act = z.getAttribute("data-act");

  if (act==="slot")     { ladeSlot(parseInt(z.getAttribute("data-i"),10)); return; }
  if (act==="loeschen") { loescheSlot(parseInt(z.getAttribute("data-i"),10)); renderStaende(); return; }
  if (act==="export") {
    S.transfer = { modus:"export", text: standAlsCode(parseInt(z.getAttribute("data-i"),10)) };
    renderStaende(); return;
  }
  if (act==="importfenster") { S.transfer = { modus:"import", text:"" }; renderStaende(); return; }
  if (act==="transferzu")    { S.transfer = null; renderStaende(); return; }
  if (act==="kopieren") {
    var feld = document.getElementById("transferfeld");
    if (feld) {
      feld.select(); feld.setSelectionRange(0, 999999);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { /* egal */ }
      if (!ok && navigator.clipboard) navigator.clipboard.writeText(feld.value);
      S.transfer.meldung = "📋 ✓";
      renderStaende();
    }
    return;
  }
  if (act==="importieren") {
    var feld2 = document.getElementById("transferfeld");
    var d = feld2 ? codeAlsStand(feld2.value) : null;
    var frei = ersterFreierSlot();
    if (!d)            { S.transfer.meldung = "✕"; renderStaende(); return; }
    if (frei < 0)      { S.transfer.meldung = "🗑️ ?"; renderStaende(); return; }
    schreibeSlot(frei, d);
    S.transfer = null;
    renderStaende();
    return;
  }
  if (act==="staende")  { S.slot = null; render(); return; }
  if (act==="witz")     { S.witz = !S.witz; speichereStand(); render(); return; }
  if (act==="waehle")   { waehleFigur(parseInt(z.getAttribute("data-i"),10)); return; }

  if (act==="jakauf")   { fuehreKaufAus(); return; }
  if (act==="neinkauf") { S.dialog = null; render(); return; }

  if (act==="obj")   tippeObjekt(z.getAttribute("data-key"), z);
  if (act==="verd")  beschuldige(z.getAttribute("data-id"), z);
  if (act==="item")  nutzeItem(z.getAttribute("data-item"));
  if (act==="weiter") naechsterFall();

  if (act==="kauf") {
    var k = z.getAttribute("data-item");
    var sym = { lupe:"🔍", hund:"🐶", lampe:"🔦" }[k];
    frage("hilfe", k, PREISE[k], '<span style="font-size:64px">'+sym+'</span>');
  }
  if (act==="kaufteil") {
    var it = itemVon(z.getAttribute("data-id"));
    if (!it || S.besitz.indexOf(it.id)>=0) return;
    var vor = {}; vor[it.slot] = it.id;
    frage("teil", it.id, it.preis, figurBox(S.profil, vor, 120));
  }
  if (act==="kaufmoebel") {
    var m = moebelVon(z.getAttribute("data-id"));
    if (!m || S.moebel.indexOf(m.id)>=0) return;
    frage("moebel", m.id, m.preis, '<span style="font-size:64px">'+m.sym+'</span>');
  }
  if (act==="upgrade") {
    var u = upgradeVon(z.getAttribute("data-id"));
    if (!u || hatUpgrade(u.id)) return;
    frage("upgrade", u.id, u.preis,
      '<span style="font-size:56px">'+u.icon+'</span><div style="font-size:22px">'+u.text+'</div>');
  }
  if (act==="paket") {
    if (S.paketKapitel >= S.kapitel) return;
    frage("paket", "paket", PAKET_PREIS, '<span style="font-size:56px">📦</span>'
      + '<div style="font-size:24px">🔍3 🐶2 🔦1</div>');
  }
  if (act==="kaufziel") {
    var zi = zielVon(z.getAttribute("data-id"));
    if (zi) frage("ziel", zi.id, zi.preis, '<span style="font-size:70px">'+zi.sym+'</span>');
  }
  if (act==="ladentab") { S.ladenTab = z.getAttribute("data-t"); S.farbwahl=null; render(); return; }
  if (act==="kaufgehege") {
    var ge = gehegeVon(z.getAttribute("data-id"));
    if (ge && S.gehege.indexOf(ge.id)<0)
      frage("gehege", ge.id, ge.preis, '<span style="font-size:70px">'+ge.sym+'</span>');
  }
  if (act==="kauftopf") {
    var fc = decodeURIComponent(z.getAttribute("data-f"));
    if (S.farbtoepfe.indexOf(fc)>=0) return;
    frage("topf", fc, TOPF_PREIS,
      '<span style="display:inline-block;width:90px;height:90px;border-radius:24px;background:'+fc+'"></span>');
  }
  if (act==="kauftier") {
    var ti = tierVon(z.getAttribute("data-id"));
    if (ti && S.tiere.indexOf(ti.id)<0)
      frage("tier", ti.id, ti.preis,
        '<svg viewBox="0 0 44 34" width="150" height="116">'+tierSVG(ti.id)+'</svg>');
  }
  if (act==="tieraktiv") {
    var ta = z.getAttribute("data-id");
    S.tierAktiv = (S.tierAktiv===ta) ? null : ta;
    speichereStand(); render(); return;
  }
  if (act==="teil")        teilAntippen(z.getAttribute("data-slot"), z.getAttribute("data-id"));
  if (act==="faerbemoebel")moebelAntippen(z.getAttribute("data-id"));

  if (act==="farbwahl") {
    var f = decodeURIComponent(z.getAttribute("data-f"));
    S.farbwahl = (S.farbwahl===f) ? null : f;
    render();
  }
  if (act==="panel") {
    var p = z.getAttribute("data-p");
    S.panel = (p==="zu" || S.panel===p) ? null : p;
    if (!S.panel) S.farbwahl = null;
    render();
  }
});

/* Beim Start den zuletzt benutzten Spielstand fortsetzen. */
(function () {
  var a = leseAktiv();
  if (a !== null && leseSlot(a)) ladeSlot(a);
  else render();
})();

/* Service Worker: macht die App nach dem ersten Aufruf offline lauffähig.
   Scheitert lautlos, wenn die Seite z.B. aus einer Vorschau kommt. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* egal */ });
  });
}
</script>
